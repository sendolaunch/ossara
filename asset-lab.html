<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSSARA — Asset Lab (dev-only)</title>
<style>
:root{--bg:#0c100c;--panel:#141a14;--panel2:#1b231b;--line:#2c382c;--ink:#cfe0c4;--dim:#8aa185;--green:#7bd86b;--gold:#c9a24a;--red:#d8736b;--blue:#6ba8d8;}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:14px;margin:0;color:var(--green);letter-spacing:.06em}
header .meta{color:var(--dim)}
header input{flex:1;max-width:380px;background:#0a0d0a;border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit}
button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
button:hover{border-color:var(--green)}
button.on{background:#26331f;border-color:var(--green);color:var(--green)}
.wrap{display:grid;grid-template-columns:212px 1fr 320px;height:calc(100vh - 49px)}
.col{overflow:auto;padding:10px}
.left{border-right:1px solid var(--line);background:var(--panel)}
.right{border-left:1px solid var(--line);background:var(--panel)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:12px 4px 6px}
.left button{display:flex;justify-content:space-between;width:100%;margin:2px 0;text-align:left}
.left .count{color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px;cursor:pointer;position:relative}
.card:hover{border-color:var(--green)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.card .fn{font-weight:600;word-break:break-all;font-size:12px}
.card .sub{color:var(--dim);font-size:11px;margin-top:3px}
.badges{position:absolute;top:6px;right:6px;display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%}
.dot.u{background:var(--blue)} .dot.s{background:var(--green)}
.tagdot{position:absolute;bottom:6px;right:6px;font-size:10px;padding:1px 5px;border-radius:8px;border:1px solid var(--line)}
.tag-use-now{color:var(--green);border-color:var(--green)} .tag-candidate{color:var(--gold);border-color:var(--gold)}
.tag-later{color:var(--blue);border-color:var(--blue)} .tag-reject{color:var(--red);border-color:var(--red)}
.kv{margin:4px 0;word-break:break-all}.kv b{color:var(--dim);font-weight:400}
#prev{width:100%;height:240px;background:#070907;border:1px solid var(--line);border-radius:7px;margin:8px 0;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;font-size:11px}
.tagrow{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
textarea{width:100%;min-height:54px;background:#0a0d0a;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px;font:inherit;resize:vertical}
.pill{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:11px}
small{color:var(--dim)}
a{color:var(--green)}
</style></head><body>
<header>
  <h1>OSSARA · ASSET LAB</h1>
  <span class="meta" id="hcount"></span>
  <input id="search" placeholder="search filename / path / loadName…">
  <button id="export">Export tags JSON</button>
  <span class="meta">dev-only · not shipped</span>
</header>
<div class="wrap">
  <div class="col left">
    <div class="sec">Quick views</div>
    <div id="quick"></div>
    <div class="sec">Category</div>
    <div id="cats"></div>
    <div class="sec">My tags</div>
    <div id="tagfilters"></div>
  </div>
  <div class="col"><div class="grid" id="grid"></div></div>
  <div class="col right" id="insp"><p><small>Select an asset to inspect.</small></p></div>
</div>

const LSK="ossara-asset-tags", LSN="ossara-asset-notes";
let tags = JSON.parse(localStorage.getItem(LSK)||"{}");
let notes = JSON.parse(localStorage.getItem(LSN)||"{}");
const saveTags=()=>localStorage.setItem(LSK,JSON.stringify(tags));
const saveNotes=()=>localStorage.setItem(LSN,JSON.stringify(notes));
let state={search:"",cat:null,quick:"all",tagf:null,sel:null};

const CATS=[...new Set(ASSETS.map(a=>a.c))].sort();
const QUICK=[["all","All assets",a=>true],
 ["dungeon","Dungeon pack",a=>a.k==="dungeon"],
 ["props","Props",a=>a.c==="props"||a.c==="banners/decor"],
 ["gates","Gates / doors",a=>a.c==="doors/gates"],
 ["struct","Walls / floors / stairs",a=>["walls","floors","stairs","columns/pillars"].includes(a.c)],
 ["enemy","Enemies / characters",a=>a.c==="enemies/characters"],
 ["used","Already used",a=>a.u],
 ["fb","First Breach candidates",a=>a.s]];
const TAGS=["use-now","candidate","later","reject"];

function matches(a){
  if(state.quick!=="all"){const q=QUICK.find(x=>x[0]===state.quick); if(q&&!q[2](a))return false;}
  if(state.cat&&a.c!==state.cat)return false;
  if(state.tagf){ if(state.tagf==="untagged"){if(tags[a.p])return false;} else if(tags[a.p]!==state.tagf)return false; }
  if(state.search){const s=state.search.toLowerCase(); if(!(a.f.toLowerCase().includes(s)||a.p.toLowerCase().includes(s)||a.n.toLowerCase().includes(s)))return false;}
  return true;
}
function renderLeft(){
  document.getElementById("quick").innerHTML="";
  QUICK.forEach(([id,label,fn])=>{const n=ASSETS.filter(fn).length;const b=document.createElement("button");
    b.className=state.quick===id?"on":"";b.innerHTML=`<span>${label}</span><span class="count">${n}</span>`;
    b.onclick=()=>{state.quick=id;state.cat=null;render();};document.getElementById("quick").appendChild(b);});
  const cc=document.getElementById("cats");cc.innerHTML="";
  const ball=document.createElement("button");ball.className=state.cat?"":"on";ball.innerHTML=`<span>— all —</span>`;ball.onclick=()=>{state.cat=null;render();};cc.appendChild(ball);
  CATS.forEach(c=>{const n=ASSETS.filter(a=>a.c===c).length;const b=document.createElement("button");
    b.className=state.cat===c?"on":"";b.innerHTML=`<span>${c}</span><span class="count">${n}</span>`;
    b.onclick=()=>{state.cat=c;render();};cc.appendChild(b);});
  const tf=document.getElementById("tagfilters");tf.innerHTML="";
  [["",null,"— any —"],...TAGS.map(t=>[t,t,t]),["untagged","untagged","untagged"]].forEach(([id,val,label])=>{
    const cnt=val&&val!=="untagged"?Object.values(tags).filter(x=>x===val).length:(val==="untagged"?ASSETS.length-Object.keys(tags).length:ASSETS.length);
    const b=document.createElement("button");b.className=state.tagf===val?"on":"";b.innerHTML=`<span>${label}</span><span class="count">${cnt}</span>`;
    b.onclick=()=>{state.tagf=val;render();};tf.appendChild(b);});
}
function renderGrid(){
  const g=document.getElementById("grid");g.innerHTML="";
  const list=ASSETS.filter(matches);
  document.getElementById("hcount").textContent=`${list.length} / ${ASSETS.length} assets`;
  list.slice(0,600).forEach(a=>{const d=document.createElement("div");d.className="card"+(state.sel===a.p?" sel":"");
    const tg=tags[a.p];
    d.innerHTML=`<div class="badges">${a.u?'<span class="dot u" title="used in game"></span>':''}${a.s?'<span class="dot s" title="First-Breach-safe"></span>':''}</div>
      <div class="fn">${a.f}</div><div class="sub">${a.k} · ${a.c}</div>
      ${tg?`<span class="tagdot tag-${tg}">${tg}</span>`:''}`;
    d.onclick=()=>{state.sel=a.p;render();renderPreview(a);};g.appendChild(d);});
  if(list.length>600)g.insertAdjacentHTML("beforeend",`<p><small>showing first 600 of ${list.length}; refine search.</small></p>`);
}
function renderInsp(){
  const a=ASSETS.find(x=>x.p===state.sel);const el=document.getElementById("insp");
  if(!a){el.innerHTML="<p><small>Select an asset to inspect.</small></p>";return;}
  const tg=tags[a.p]||"";
  el.innerHTML=`<div id="prev">click “Load 3D” (run under <code>npm&nbsp;run&nbsp;dev</code>)</div>
    <button id="load3d">Load 3D preview</button>
    <div class="kv"><b>file</b><br>${a.f}</div>
    <div class="kv"><b>path</b><br>${a.p} <button id="cp">copy</button></div>
    <div class="kv"><b>loadName</b><br><code>${a.n}</code> <button id="cn">copy</button></div>
    <div class="kv"><b>pack</b> ${a.k} &nbsp; <b>category</b> ${a.c}</div>
    <div class="kv"><b>meshes/materials</b> ${a.m==null?"glb (binary)":a.m+" / "+a.t}</div>
    <div class="kv">${a.u?'<span class="pill">used in game</span> ':''}${a.s?'<span class="pill" style="color:var(--green);border-color:var(--green)">First-Breach-safe</span>':'<span class="pill" style="color:var(--red);border-color:var(--red)">not crypt-safe</span>'}</div>
    <div class="sec">Tag</div><div class="tagrow">${TAGS.map(t=>`<button data-t="${t}" class="${tg===t?'on':''}">${t}</button>`).join("")}<button data-t="" class="${tg?'':'on'}">clear</button></div>
    <div class="sec">Notes</div><textarea id="note" placeholder="notes for this asset…">${(notes[a.p]||"").replace(/</g,"&lt;")}</textarea>`;
  el.querySelector("#cp").onclick=()=>navigator.clipboard.writeText(a.p);
  el.querySelector("#cn").onclick=()=>navigator.clipboard.writeText(a.n);
  el.querySelectorAll(".tagrow button").forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(t)tags[a.p]=t;else delete tags[a.p];saveTags();render();});
  el.querySelector("#note").onchange=e=>{notes[a.p]=e.target.value;saveNotes();};
  el.querySelector("#load3d").onclick=()=>renderPreview(a,true);
}
let renderer,scene,camera,raf;
async function renderPreview(a,force){
  const host=document.getElementById("prev");if(!host)return;
  if(!force){return;} // only load on demand
  host.textContent="loading…";
  try{
    const THREE=await import("three");
    const {GLTFLoader}=await import("three/addons/loaders/GLTFLoader.js");
    const {OrbitControls}=await import("three/addons/controls/OrbitControls.js");
    host.innerHTML="";
    if(raf)cancelAnimationFrame(raf);
    const w=host.clientWidth,h=host.clientHeight;
    renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(w,h);renderer.setClearColor(0x070907);host.appendChild(renderer.domElement);
    scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,w/h,0.01,100);
    scene.add(new THREE.AmbientLight(0xffffff,0.9));const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(3,6,4);scene.add(dl);
    const ctrl=new OrbitControls(camera,renderer.domElement);
    const url=a.p.replace(/^public\//,"/");
    new GLTFLoader().load(url,(g)=>{
      const box=new THREE.Box3().setFromObject(g.scene);const sz=box.getSize(new THREE.Vector3());const ctr=box.getCenter(new THREE.Vector3());
      g.scene.position.sub(ctr);const r=Math.max(sz.x,sz.y,sz.z)||1;camera.position.set(r*1.6,r*1.2,r*1.6);ctrl.update();
      scene.add(g.scene);
      (function loop(){raf=requestAnimationFrame(loop);g.scene.rotation.y+=0.006;renderer.render(scene,camera);})();
    },undefined,(err)=>{host.textContent="load failed (run under npm run dev; check console): "+url;});
  }catch(e){host.textContent="3D preview needs the dev server + internet (three.js CDN). Error: "+e.message;}
}
function render(){renderLeft();renderGrid();renderInsp();}
document.getElementById("search").oninput=e=>{state.search=e.target.value;renderGrid();};
document.getElementById("export").onclick=()=>{
  const out=ASSETS.filter(a=>tags[a.p]).map(a=>({path:a.p,loadName:a.n,category:a.c,tag:tags[a.p],note:notes[a.p]||""}));
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);
  const link=document.createElement("a");link.href=u;link.download="asset-tags.json";link.click();
  navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(out,null,2));
};
render();
</script>
